name: Create Mapbox 3.31.1 CarPlay branch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carplay-compatibility-3-31-1
  cancel-in-progress: false

env:
  RETAINED_PATCH_COMMIT: a2e4fc7d388046815d9789519832832fb2db5f3f
  PREVIOUS_UPSTREAM_COMMIT: e10d66db11aaa9725dc26f25d74f27d31a88a5f3
  UPSTREAM_TAG: 3.31.1
  UPSTREAM_COMMIT: 1bdd006ce0d2982cb5a27c30fbccec836521c3f4
  PATCH_BRANCH: sdk/3.31.1-carplay
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the retained CarPlay patch
        uses: actions/checkout@v7
        with:
          ref: 3.30.1-carplay.1
          fetch-depth: 0

      - name: Verify and export the retained patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RETAINED_PATCH_COMMIT"
          test "$(git rev-parse HEAD^)" = "$PREVIOUS_UPSTREAM_COMMIT"
          git diff --check "$PREVIOUS_UPSTREAM_COMMIT" HEAD

          python3 - <<'PY'
          import os
          import subprocess

          expected = {
              "Sources/MapboxNavigationUIKit/CarPlay/CarPlayNavigationViewController.swift",
              "Tests/MapboxNavigationPackageTests/CarPlayNavigationViewControllerTests.swift",
          }
          changed = subprocess.check_output(
              ["git", "diff", "--name-only",
               os.environ["PREVIOUS_UPSTREAM_COMMIT"], "HEAD"],
              text=True,
          ).splitlines()
          if set(changed) != expected:
              raise SystemExit(f"Unexpected retained patch files: {changed}")
          PY

          git diff --binary "$PREVIOUS_UPSTREAM_COMMIT" HEAD \
            > "$RUNNER_TEMP/carplay-compatibility.patch"

      - name: Check that the destination branch is new
        shell: bash
        run: |
          set -euo pipefail
          existing=$(git ls-remote --heads origin "refs/heads/$PATCH_BRANCH")
          if [ -n "$existing" ]; then
            echo "Destination branch already exists; no changes were pushed."
            exit 1
          fi

      - name: Fetch and verify Mapbox 3.31.1
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags \
            https://github.com/mapbox/mapbox-navigation-ios.git \
            "refs/tags/$UPSTREAM_TAG"

          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$UPSTREAM_COMMIT"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git switch --create "$PATCH_BRANCH" "$UPSTREAM_COMMIT"

          grep -F 'let mapsVersion: Version = "11.31.1"' Package.swift
          grep -F 'let navNativeVersion: Version = "324.31.1"' Package.swift

      - name: Apply and verify the CarPlay changes
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/carplay-compatibility.patch"
          git apply "$RUNNER_TEMP/carplay-compatibility.patch"
          git diff --check

          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          expected = {
              "Sources/MapboxNavigationUIKit/CarPlay/CarPlayNavigationViewController.swift",
              "Tests/MapboxNavigationPackageTests/CarPlayNavigationViewControllerTests.swift",
          }
          changed = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          if set(changed) != expected:
              raise SystemExit(f"Unexpected changed files: {changed}")

          for name in sorted(expected):
              retained = subprocess.check_output(
                  ["git", "show", os.environ["RETAINED_PATCH_COMMIT"] + ":" + name]
              )
              if Path(name).read_bytes() != retained:
                  raise SystemExit(f"Retained CarPlay content differs: {name}")
          print("Verified both CarPlay files match the retained release exactly.")
          PY

      - name: Create and verify the new patch commit
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            Sources/MapboxNavigationUIKit/CarPlay/CarPlayNavigationViewController.swift \
            Tests/MapboxNavigationPackageTests/CarPlayNavigationViewControllerTests.swift
          git -c commit.gpgsign=false commit \
            -m "Port CarPlay travel estimate adjustments to 3.31.1"

          test "$(git rev-parse HEAD^)" = "$UPSTREAM_COMMIT"
          test "$(git rev-list --count "$UPSTREAM_COMMIT..HEAD")" = "1"
          test "$(git show -s --format=%an HEAD)" = "$GIT_AUTHOR_NAME"
          test "$(git show -s --format=%ae HEAD)" = "$GIT_AUTHOR_EMAIL"
          test "$(git show -s --format=%cn HEAD)" = "$GIT_COMMITTER_NAME"
          test "$(git show -s --format=%ce HEAD)" = "$GIT_COMMITTER_EMAIL"
          test -z "$(git status --porcelain)"
          git diff --check "$UPSTREAM_COMMIT" HEAD
          git show --format=fuller --stat HEAD

      - name: Push the new compatibility branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$PATCH_BRANCH"
          {
            echo "Created branch: $PATCH_BRANCH"
            echo "Upstream commit: $UPSTREAM_COMMIT"
            echo "Patch commit: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
